name: Python skills current-main validation
on:
  push:
    branches: [validation/skills-python-oct30]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        source: [candidate]
        include:
          - python: '3.12'
            source: baseline
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ matrix.source == 'candidate' && 'bc4aa4740a822c312e027a43adb4aaa49f593217' || 'b24021c82e4e5055f689639d59332401c5051a8e' }}
          fetch-depth: 0
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y build-essential libffi-dev cmake libjpeg-dev zlib1g-dev
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Locked dependencies
        run: uv sync --directory py --frozen --group lint
      - name: Lock and generated typing
        run: |
          uv lock --check --directory py
          ./py/bin/generate_schema_typing --ci
      - name: Full Python suite
        if: ${{ !cancelled() }}
        run: |
          mkdir -p /tmp/skills-evidence
          uv run --no-sync --directory py pytest -v . --junitxml=/tmp/skills-evidence/full.xml > /tmp/skills-evidence/full.log 2>&1
      - name: Scoped style and package build
        if: ${{ !cancelled() }}
        run: |
          uv run --no-sync --directory py ruff format --check --preview packages/genkit-middleware
          uv run --no-sync --directory py ruff check --preview packages/genkit-middleware
          uv build --directory py/packages/genkit-middleware --out-dir /tmp/skills-evidence/dist
          uv run --no-sync --directory py twine check /tmp/skills-evidence/dist/*
      - name: Type diagnostics
        if: ${{ !cancelled() }}
        run: |
          set +e
          uv run --no-sync --directory py ty check packages/genkit-middleware > /tmp/skills-evidence/ty.log 2>&1
          result=$?
          printf '%s\n' "$result" > /tmp/skills-evidence/ty.exit
          exit 0
      - name: Exact current-main source negative control
        if: ${{ !cancelled() && matrix.python == '3.12' && matrix.source == 'candidate' }}
        shell: bash
        run: |
          file=py/packages/genkit-middleware/src/genkit_middleware/_skills.py
          restore_source() { git restore --source=bc4aa4740a822c312e027a43adb4aaa49f593217 --worktree -- "$file"; }
          trap restore_source EXIT
          git restore --source=b24021c82e4e5055f689639d59332401c5051a8e --worktree -- "$file"
          set +e
          uv run --no-sync --directory py pytest -v packages/genkit-middleware/tests/skills_test.py --junitxml=/tmp/skills-evidence/negative.xml > /tmp/skills-evidence/negative.log 2>&1
          result=$?
          set -e
          test "$result" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('/tmp/skills-evidence/negative.xml').iter('testcase'))
          failures = [c for c in cases if c.find('failure') is not None]
          assert not any(c.find('error') is not None for c in cases)
          expected = {'test_skills_default_paths': 2, 'test_skills_catalog_names_activation_tool': 2, 'test_skills_refreshes_owned_and_legacy_catalogs': 7, 'test_skills_preserves_foreign_catalogs': 2}
          from collections import Counter
          actual = Counter(c.attrib['name'].split('[')[0] for c in failures)
          assert actual == expected, actual
          print(dict(actual))
          PY
          restore_source
          trap - EXIT
          uv run --no-sync --directory py pytest -v packages/genkit-middleware/tests/skills_test.py --junitxml=/tmp/skills-evidence/restored.xml > /tmp/skills-evidence/restored.log 2>&1
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: skills-${{ matrix.source }}-${{ matrix.python }}
          path: /tmp/skills-evidence/
          if-no-files-found: warn
